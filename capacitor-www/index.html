<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#09090b" />
    <title>Limitless Coaching</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100dvh;
        background: #09090b;
        color: #fafafa;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      .shell {
        display: grid;
        min-height: 100dvh;
        place-items: center;
        padding: 2rem;
        text-align: center;
      }
      .mark {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        background: linear-gradient(145deg, #12141c, #0a0b10);
        border: 1px solid rgba(107, 140, 255, 0.35);
        display: grid;
        place-items: center;
        font-size: 2rem;
        font-weight: 800;
        color: #6b8cff;
        margin: 0 auto 1rem;
      }
      p {
        margin: 0;
        opacity: 0.72;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div>
        <div class="mark" aria-hidden="true">L</div>
        <p>Limitless Coaching wordt geladen…</p>
      </div>
    </div>
  </body>
</html>
